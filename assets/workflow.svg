<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="565" viewBox="0 0 1000 565" role="img" aria-labelledby="t"><title id="t">Publication-aware financial text workflow</title><rect width="1000" height="565" rx="12" fill="#f5f7fa"/><rect x="28" y="20" width="944" height="67" rx="9" fill="#101928"/><text x="49" y="62" font-family="Arial,sans-serif" font-size="25" fill="#f5f7fa">01  Official public-domain sources and source hashes</text><path d="M500 90 V104" stroke="#36B3A8" stroke-width="4"/><rect x="28" y="109" width="944" height="67" rx="9" fill="#203940"/><text x="49" y="151" font-family="Arial,sans-serif" font-size="25" fill="#f5f7fa">02  Measurement time differs from publication time</text><path d="M500 179 V193" stroke="#36B3A8" stroke-width="4"/><rect x="28" y="198" width="944" height="67" rx="9" fill="#101928"/><text x="49" y="240" font-family="Arial,sans-serif" font-size="25" fill="#f5f7fa">03  Past-only numeric features + train-fitted TF-IDF</text><path d="M500 268 V282" stroke="#36B3A8" stroke-width="4"/><rect x="28" y="287" width="944" height="67" rx="9" fill="#203940"/><text x="49" y="329" font-family="Arial,sans-serif" font-size="25" fill="#f5f7fa">04  2017-2019 selection / purge unavailable labels</text><path d="M500 357 V371" stroke="#36B3A8" stroke-width="4"/><rect x="28" y="376" width="944" height="67" rx="9" fill="#101928"/><text x="49" y="418" font-family="Arial,sans-serif" font-size="25" fill="#f5f7fa">05  Freeze cohort and settings before confirmation</text><path d="M500 446 V460" stroke="#36B3A8" stroke-width="4"/><rect x="28" y="465" width="944" height="67" rx="9" fill="#203940"/><text x="49" y="507" font-family="Arial,sans-serif" font-size="25" fill="#f5f7fa">06  2020-2024 aligned predictions and paired intervals</text></svg>