[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-text-validation"
version = "0.1.0"
description = "Publication-aware real public-data price, text and fusion validation"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = ["numpy>=2.1,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "threadpoolctl>=3.5,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["financial_text_validation*"]

[tool.setuptools.package-data]
financial_text_validation = ["protocol.json", "data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
